name: Build TrashCat

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Build for Windows'
        type: boolean
        default: false
      macos:
        description: 'Build for macOS'
        type: boolean
        default: false
      android:
        description: 'Build for Android'
        type: boolean
        default: false
      webgl:
        description: 'Build for WebGL'
        type: boolean
        default: false
      ios:
        description: "Build for iOS"
        type: boolean
        default: false
      branch:
        description: 'Branch to checkout for AltTester submodule'
        default: 'development'
        required: true
      host:
        description: 'AltServer Host'
        default: '127.0.0.1'
      port:
        description: 'AltServer Port'
        default: '13000'

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  get-selected-platforms:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set Matrix
        id: set-matrix
        run: |
          platforms=()
          if ${{ github.event.inputs.windows }}; then platforms+=("windows"); fi
          if ${{ github.event.inputs.macos }}; then platforms+=("macos"); fi
          if ${{ github.event.inputs.android }}; then platforms+=("android"); fi
          if ${{ github.event.inputs.webgl }}; then platforms+=("webgl"); fi
          if ${{ github.event.inputs.ios }}; then platforms+=("ios"); fi

          json=""
          sep=""
          for platform in "${platforms[@]}"; do
            case "${platform,,}" in
              windows) os='["self-hosted", "Windows", "product"]'; plat='Windows' ;;
              macos) os='["self-hosted", "MAC37"]'; plat='macOS' ;;
              android) os='["self-hosted", "MAC37"]'; plat='Android' ;;
              webgl) os='["self-hosted", "MAC37"]'; plat='WebGL' ;;
              ios) os='["self-hosted", "MAC37"]'; plat='iOS' ;;
              *) continue ;;
            esac
            json="${json}${sep}{\"platform\":\"$plat\",\"os\":$os}"
            sep=","
          done

          echo "matrix=[${json}]" >> $GITHUB_OUTPUT

  build:
    needs: get-selected-platforms
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include: ${{ fromJson(needs.get-selected-platforms.outputs.platforms) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Update Submodules
        run: |
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -fd
          git submodule update --init --recursive
        
      - name: Checkout AltTester Submodule Branch
        shell: bash
        run: |
          cd TrashCat/Assets/AltTester-Unity-SDK
          git fetch
          git checkout "${{ github.event.inputs.branch || 'development' }}"
          git pull --rebase origin "${{ github.event.inputs.branch || 'development' }}"

      - name: Remove Unity Ads for iOS
        if: matrix.platform == 'iOS'
        run: |
          echo "Removing com.unity.ads from manifest.json"
          jq 'del(.dependencies["com.unity.ads"])' TrashCat/Packages/manifest.json > TrashCat/Packages/tmp_manifest.json
          mv TrashCat/Packages/tmp_manifest.json TrashCat/Packages/manifest.json          

      - name: Build TrashCat
        shell: bash
        env:
          UNITY_CLI_PLATFORM: ${{ matrix.platform }}
        run: |
          export ALTSERVER_PORT=${{ github.event.inputs.port }}
          export ALTSERVER_HOST="${{ github.event.inputs.host }}"

          if [ "${{ matrix.platform }}" = "Windows" ]; then
            projectPath="$GITHUB_WORKSPACE/TrashCat"
          else
            projectPath="$CI_PROJECT_DIR/TrashCat"
          fi

          "$UNITY_2021_3_HOME" -batchmode -stackTraceLogType None -projectPath "$projectPath" -executeMethod AddressablesBuilder.BuildAddressablesForCurrentPlatform -logFile buildAddressables.log -quit

          case "${{ matrix.platform }}" in
            "Windows")
              "$UNITY_2021_3_HOME" -batchmode -stackTraceLogType None -projectPath "$projectPath" -executeMethod BuildTrashCat.WindowsBuildFromCommandLine -logFile buildWindows.log -quit
              ;;
            "macOS")
              "$UNITY_2021_3_HOME" -batchmode -stackTraceLogType None -projectPath "$projectPath" -executeMethod BuildTrashCat.MacBuildFromCommandLine -logFile buildMac.log -quit
              ;;
            "Android")
              "$UNITY_2021_3_HOME" -batchmode -stackTraceLogType None -projectPath "$projectPath" -executeMethod BuildTrashCat.AndroidBuildFromCommandLine -logFile buildAndroid.log -quit
              ;;
            "WebGL")
              "$UNITY_2021_3_HOME" -batchmode -stackTraceLogType None -projectPath "$projectPath" -executeMethod BuildTrashCat.WebGLBuildFromCommandLine -logFile buildWebGL.log -quit
              ;;
            "iOS")
              "$UNITY_2021_3_HOME" -batchmode -stackTraceLogType None -projectPath "$projectPath" -executeMethod BuildTrashCat.IosBuildFromCommandLine -logFile buildiOS.log -quit
              xcodebuild -project "${GITHUB_WORKSPACE}/TrashCat/TrashCat/Unity-iPhone.xcodeproj" -scheme Unity-iPhone -archivePath "${GITHUB_WORKSPACE}/TrashCat/TrashCat/Unity-iPhone.xcarchive" archive
              xcodebuild -exportArchive -archivePath "${GITHUB_WORKSPACE}/TrashCat/TrashCat/Unity-iPhone.xcarchive" -exportOptionsPlist $EXPORT_OPTIONS_LOCATION/export-options.plist -exportPath ./
              osascript -e 'tell app "Xcode" to quit'
              ;;
              esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-${{ matrix.platform }}-Artifact
          path: |
            **/*.log
            **/TrashCatBuild/*
            **/TrashCat.apk
            **/TrashCat.app
            **/TrashCat.ipa
            **/build/webgl